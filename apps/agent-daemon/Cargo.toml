[package]
name = "omarchy-agent-daemon"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.23"
bevy_ecs = { version = "=0.20.1", default-features = false }
bevy_log = "=0.20.1"
bevy_tasks = { version = "=0.20.1", default-features = false }
fastembed = { version = "=4.9.1", default-features = false }
futures = "0.3"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
ort = { version = "=2.0.0-rc.9", default-features = false }
rayon = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
rig-basics = { version = "=0.47.1", default-features = false }
rig-core = { version = "=0.47.1", default-features = false, features = ["reqwest", "rustls"] }
rig-ecs = "=0.47.1"
rig-fastembed = { version = "=0.47.1", default-features = false, features = ["ort-download-binaries"] }
rig-harness = "=0.47.1"
rig-reqwest = "=0.47.1"
ring = "0.17"
rusqlite = { version = "0.32.1", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "rt-multi-thread", "net", "sync", "time"] }
tokio-stream = "0.1"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = "1"

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
tokio = { version = "1", features = ["io-util", "macros", "process", "time"] }
