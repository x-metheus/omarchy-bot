[package]
name = "omarchy-bot-sidecar"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"

[dependencies]
base64 = "0.22"
futures-util = { version = "0.3", features = ["sink"] }
hostname = "0.4"
regex = "1"
roxmltree = "0.21"
native-tls = { version = "0.2", features = ["vendored"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "process", "io-util", "signal"] }
tokio-tungstenite = { version = "0.28", features = ["native-tls-vendored"] }
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
