[package]
name = "omarchy-bot"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Omarchy Bot application"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-deep-link = "=2.6.3"
tauri-plugin-opener = "=2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
getrandom = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }
gio = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native"] }
security-framework = "3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "=2.5.5"

[features]
custom-protocol = ["tauri/custom-protocol"]
