# Pinned sources for the self-contained Sway runtime bundle.
#
# Every archive is downloaded and its SHA-256 checked before anything is
# unpacked; the build aborts on a mismatch. Update a pin only together with the
# published archive hash in the runtime supply descriptor.
#
# shellcheck shell=sh

