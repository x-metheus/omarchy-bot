name: windows-app
on:
  pull_request:
    paths:
      - 'apps/omarchy-bot/**'
      - 'apps/agent-daemon/**'
      - 'packages/**'
      - 'scripts/windows-app/**'
      - 'scripts/build-agent-daemon.ts'
      - 'scripts/app-release.ts'
      - 'tests/integration/app-release.test.ts'
      - 'bun.lock'
      - '.github/workflows/windows-*.yml'
permissions:
  contents: read
jobs:
  nsis-install:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_HOME: ${{ github.workspace }}/.lane/windows-app/cargo
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - uses: dtolnay/rust-toolchain@1.97.1
      - run: bun install --frozen-lockfile
      - run: bun test tests/integration/app-release.test.ts
      - name: Build NSIS installer and standalone Agent Daemon
        shell: pwsh
        run: ./scripts/windows-app/build.ps1
      - name: Install, inspect registered deep-link handler, uninstall
        shell: pwsh
        run: ./scripts/windows-app/smoke.ps1 -InstallOnly
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-x64-unsigned-preview-install-evidence
          path: |
            .lane/dist/*
            .lane/windows-app/build-result.json
            .lane/windows-app/evidence/
          if-no-files-found: error
