name: plugin-runtime

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugin-runtime-${{ github.sha }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config \
            wayland-protocols \
            zstd

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Build the Sway bundle for the archive
        id: sway
        run: |
          bash scripts/build-sway-runtime.sh .lane/dist
          release=$(. scripts/sway-runtime/sources.lock && printf '%s' "$SWAY_RUNTIME_RELEASE")
          bundle=".lane/dist/omarchy-bot-sway-runtime-$release-x86_64.tar.gz"
          if [ ! -f "$bundle" ]; then
            echo "::error::The Sway bundle build produced no archive at $bundle."
            exit 1
          fi
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"

      - name: Install and build the plugin runtime
        run: |
          bun install --frozen-lockfile
          bun run --filter=@omarchy-bot/web build
          bun apps/daemon/native/pointer-helper/build.ts
          bun apps/daemon/native/capture-helper/build.ts
          bun apps/daemon/native/bot-desktop/build.ts

      - name: Prepare pinned runtime fonts
        run: bash scripts/prepare-fonts.sh .lane/fonts

      - name: Package the runtime archive
        id: package
        env:
          SWAY_BUNDLE: ${{ steps.sway.outputs.bundle }}
        run: |
          archive=$(bash scripts/package-plugin-runtime.sh . dist-runtime "$SWAY_BUNDLE" .lane/fonts)
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "sha256=$archive.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: omarchy-bot-runtime-${{ github.sha }}-x86_64
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.sha256 }}
          if-no-files-found: error

      - name: Publish release asset
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          tag="runtime-${GITHUB_SHA}"
          notes="Omarchy plugin runtime for \`${GITHUB_SHA}\` (x86_64).

          This is the same Omarchy plugin payload consumed by \`plugin/launch.sh\`, not a standalone application.

          Download:

          \`https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/$(basename "$ARCHIVE")\`

          SHA-256:

          \`\`\`
          $(cat "$ARCHIVE.sha256")
          \`\`\`
          "
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$ARCHIVE" "$ARCHIVE.sha256" --clobber
          else
            gh release create "$tag" "$ARCHIVE" "$ARCHIVE.sha256" \
              --title "Plugin runtime ${GITHUB_SHA:0:12}" \
              --notes "$notes" \
              --target "$GITHUB_SHA"
          fi
