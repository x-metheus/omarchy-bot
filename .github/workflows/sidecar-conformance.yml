name: sidecar-conformance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sidecar:
    name: Local Sidecar (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            binary: sidecar
          - runner: macos-latest
            binary: sidecar
          - runner: windows-latest
            binary: sidecar.exe
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Run executor and policy suite
        run: bun test apps/sidecar
      - name: Compile the native Sidecar
        run: bun build --compile apps/sidecar/src/main.ts --outfile .lane/${{ matrix.binary }}
      - name: Exercise compiled registration, per-OS policy, tree cancellation and TLS
        env:
          OMARCHY_BOT_TEST_SIDECAR_BINARY: .lane/${{ matrix.binary }}
        run: bun test tests/integration/local-sidecar-process.test.ts
