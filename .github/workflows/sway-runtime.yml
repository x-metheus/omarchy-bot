name: sway-runtime

# Builds and verifies the self-contained Sway runtime bundle that the Service
# uses for Bot Computers (Computer ADR 0011). The bundle ships inside the
# runtime archive, so this workflow only proves it reproduces the SHA-256 pinned
# in the runtime supply descriptor and passes bundle conformance.
on:
  push:
    branches: [main]
    paths:
      - "scripts/sway-runtime/**"
      - "scripts/build-sway-runtime.sh"
      - "apps/daemon/native/**"
      - ".github/workflows/sway-runtime.yml"
      - "apps/daemon/src/modules/computer/swayRuntimeSupply.ts"
      - "tests/integration/bot-screen-sway-bundle-conformance.test.ts"
  pull_request:
    paths:
      - "scripts/sway-runtime/**"
      - "scripts/build-sway-runtime.sh"
      - "apps/daemon/native/**"
      - ".github/workflows/sway-runtime.yml"
      - "apps/daemon/src/modules/computer/swayRuntimeSupply.ts"
      - "tests/integration/bot-screen-sway-bundle-conformance.test.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sway-runtime-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE: sway-1.10.1-wayvnc-0.8.0-wlroots-0.18.1-v1
  ASSET: omarchy-bot-sway-runtime-sway-1.10.1-wayvnc-0.8.0-wlroots-0.18.1-v1-x86_64.tar.gz

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the bundle in the pinned Alpine image
        run: bash scripts/build-sway-runtime.sh .lane/dist

      - name: Read the pinned checksum from the supply descriptor
        id: pin
        run: |
          pin=$(grep -o 'sha256: *"[0-9a-f]\{64\}"' apps/daemon/src/modules/computer/swayRuntimeSupply.ts \
            | head -n 1 | grep -o '[0-9a-f]\{64\}' || true)
          echo "sha256=$pin" >> "$GITHUB_OUTPUT"

      - name: Verify reproducibility against the pinned checksum
        run: |
          actual=$(sha256sum ".lane/dist/$ASSET" | cut -d' ' -f1)
          pinned="${{ steps.pin.outputs.sha256 }}"
          if ! [[ "$pinned" =~ ^[0-9a-f]{64}$ ]] || [[ "$pinned" == "$(printf '0%.0s' {1..64})" ]]; then
            echo "::error::A nonzero SHA-256 pin is required before shipping the runtime."
            exit 1
          fi
          if [ "$actual" != "$pinned" ]; then
            echo "::error::Bundle hash $actual does not match pinned $pinned."
            echo "::error::Update the runtime supply descriptor and pin together; not shipping."
            exit 1
          fi

      - name: Bundle-only real-Sway conformance (Ubuntu 22.04 + Alpine musl)
        run: sh scripts/sway-runtime/conformance/run.sh ".lane/dist/$ASSET"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: omarchy-bot-sway-runtime-${{ env.RELEASE }}-x86_64
          path: |
            .lane/dist/${{ env.ASSET }}
            .lane/dist/${{ env.ASSET }}.sha256
          if-no-files-found: error
