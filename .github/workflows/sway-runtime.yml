name: sway-runtime

# Builds and publishes the self-contained Sway runtime bundle that the Service
# uses for Bot Computers (Computer ADR 0011). The archive is only published
# after it reproduces the SHA-256 pinned in the runtime supply descriptor.
on:
  push:
    branches: [main]
    paths:
      - "scripts/sway-runtime/**"
      - "scripts/build-sway-runtime.sh"
      - "apps/daemon/native/**"
      - ".github/workflows/sway-runtime.yml"
      - "apps/daemon/src/modules/computer/swayRuntimeSupply.ts"
      - "tests/integration/bot-screen-sway-bundle-conformance.test.ts"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sway-runtime-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE: sway-1.10.1-wayvnc-0.8.0-wlroots-0.18.1-v1
  ASSET: omarchy-bot-sway-runtime-sway-1.10.1-wayvnc-0.8.0-wlroots-0.18.1-v1-x86_64.tar.gz

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the bundle in the pinned Alpine image
        run: bash scripts/build-sway-runtime.sh .lane/dist

      - name: Read the pinned checksum from the supply descriptor
        id: pin
        run: |
          pin=$(grep -o 'sha256: *"[0-9a-f]\{64\}"' apps/daemon/src/modules/computer/swayRuntimeSupply.ts \
            | head -n 1 | grep -o '[0-9a-f]\{64\}' || true)
          echo "sha256=$pin" >> "$GITHUB_OUTPUT"

      - name: Verify reproducibility against the pinned checksum
        run: |
          actual=$(sha256sum ".lane/dist/$ASSET" | cut -d' ' -f1)
          pinned="${{ steps.pin.outputs.sha256 }}"
          if ! [[ "$pinned" =~ ^[0-9a-f]{64}$ ]] || [[ "$pinned" == "$(printf '0%.0s' {1..64})" ]]; then
            echo "::error::A nonzero SHA-256 pin is required before publishing the runtime."
            exit 1
          fi
          if [ "$actual" != "$pinned" ]; then
            echo "::error::Bundle hash $actual does not match pinned $pinned."
            echo "::error::Update the runtime supply descriptor and pin together; not publishing."
            exit 1
          fi

      - name: Bundle-only real-Sway conformance (Ubuntu 22.04 + Alpine musl)
        run: sh scripts/sway-runtime/conformance/run.sh ".lane/dist/$ASSET"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: omarchy-bot-sway-runtime-${{ env.RELEASE }}-x86_64
          path: |
            .lane/dist/${{ env.ASSET }}
            .lane/dist/${{ env.ASSET }}.sha256
          if-no-files-found: error

      - name: Publish release asset
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="sway-runtime-${{ steps.pin.outputs.sha256 }}"
          checksum=$(cat ".lane/dist/$ASSET.sha256")
          notes="Self-contained Sway Bot Computer runtime for \`$RELEASE\` (x86_64, musl).

          Built from pinned upstream sources in Alpine 3.21.3; contains Sway, wlroots,
          WayVNC, wlr-randr, Xwayland, grim, dbus-daemon, and the capture, input, and
          bot-desktop helpers with their full non-libc library closure and XKB/D-Bus
          runtime data.

          Download:

          \`https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${ASSET}\`

          SHA-256:

          \`\`\`
          ${checksum}
          \`\`\`
          "
          if gh release view "$tag" >/dev/null 2>&1; then
            mkdir -p .lane/published
            gh release download "$tag" --pattern "$ASSET" --pattern "$ASSET.sha256" --dir .lane/published
            cmp ".lane/dist/$ASSET" ".lane/published/$ASSET"
            cmp ".lane/dist/$ASSET.sha256" ".lane/published/$ASSET.sha256"
          else
            gh release create "$tag" ".lane/dist/$ASSET" ".lane/dist/$ASSET.sha256" \
              --title "Sway runtime bundle" --notes "$notes" --target "$GITHUB_SHA"
          fi
