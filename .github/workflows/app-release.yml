name: app-release

on:
  push:
    tags: ["app-v*"]

permissions:
  contents: read

concurrency:
  group: app-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate independent app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          [[ $GITHUB_REF_NAME =~ ^app-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo '::error::App release tags must be app-vX.Y.Z with no leading zeros.'; exit 1; }
          printf 'version=%s\n' "${GITHUB_REF_NAME#app-v}" >> "$GITHUB_OUTPUT"
  linux:
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    environment: app-release
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
      TAURI_UPDATER_ENDPOINT: https://github.com/${{ github.repository }}/releases/download/app-latest/latest.json
    steps:
      - uses: actions/checkout@v4
      - name: Prove signed update, tamper refusal, and restart in private WebKitGTK
        run: bash scripts/linux-app/updater-smoke.sh
      - name: Build signed release AppImage in pinned container
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${TAURI_UPDATER_PUBKEY:?Set the app-release TAURI_UPDATER_PUBKEY variable}"
          : "${TAURI_SIGNING_PRIVATE_KEY:?Set the app-release TAURI_SIGNING_PRIVATE_KEY secret}"
          bash scripts/build-linux-app.sh
      - name: Smoke the release AppImage in private WebKitGTK
        run: bash scripts/smoke-linux-app.sh ".lane/dist/omarchy-bot_${APP_VERSION}_amd64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-linux
          path: |
            .lane/dist/omarchy-bot_${{ env.APP_VERSION }}_amd64.AppImage
            .lane/dist/omarchy-bot_${{ env.APP_VERSION }}_amd64.AppImage.sig
            .lane/dist/omarchy-bot_${{ env.APP_VERSION }}_amd64.AppImage.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-release-linux-evidence
          path: .lane/linux-app/evidence/
          if-no-files-found: warn
  macos:
    needs: version
    uses: ./.github/workflows/macos-app.yml
    with:
      signed: true
      updater: true
      version: ${{ needs.version.outputs.version }}
      environment: app-release
    secrets: inherit
  windows:
    needs: version
    uses: ./.github/workflows/windows-app-release.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit
  publish:
    needs: [version, linux, macos, windows]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment: app-release
    permissions:
      contents: write
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Exercise complete release assembly and rejection cases
        run: bun test tests/integration/app-release.test.ts
      - uses: actions/download-artifact@v4
        with:
          name: app-release-linux
          path: .lane/release-assets
      - uses: actions/download-artifact@v4
        with:
          name: macos-app-aarch64
          path: .lane/release-assets
      - uses: actions/download-artifact@v4
        with:
          name: macos-app-x64
          path: .lane/release-assets
      - uses: actions/download-artifact@v4
        with:
          name: windows-app-build
          path: .lane/windows-release
      - name: Assemble and validate all four updater platforms
        shell: bash
        run: |
          set -euo pipefail
          cp .lane/windows-release/dist/* .lane/release-assets/
          bun scripts/app-release.ts .lane/release-assets
          printf '%s\n' \
            "Omarchy Bot ${APP_VERSION} for Linux x86_64, macOS Apple Silicon and Intel, and Windows x64." \
            'App versions are independent of Service runtime versions.' \
            '' \
            'Includes the AppImage, signed and notarized dmgs, macOS .app.tar.gz updater payloads, NSIS installer, SHA-256 checksums, Tauri updater signatures, and one complete latest.json.' \
            'Windows is an unsigned preview and may show SmartScreen warnings. The release requires the complete packaged WebView2 suite; macOS support additionally requires the recorded WKWebView checklist on both architectures.' \
            > "$RUNNER_TEMP/app-release-notes.md"
      - name: Publish complete immutable app release
        shell: bash
        run: |
          set -euo pipefail
          # API failure must fail closed, rather than look like a missing release.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | {tag_name, draft}' | jq --slurp --arg tag "$GITHUB_REF_NAME" '[.[] | select(.tag_name == $tag)]' > "$RUNNER_TEMP/existing-release.json"
          count=$(jq length "$RUNNER_TEMP/existing-release.json")
          [[ $count -le 1 ]]
          if [[ $count == 0 ]]; then
            gh release create "$GITHUB_REF_NAME" .lane/release-assets/* \
              --draft --prerelease --verify-tag --latest=false --title "Omarchy Bot ${APP_VERSION}" \
              --notes-file "$RUNNER_TEMP/app-release-notes.md"
          elif [[ $(jq -r '.[0].draft' "$RUNNER_TEMP/existing-release.json") == true ]]; then
            # A failed upload can only be resumed while the release is still private.
            gh release upload "$GITHUB_REF_NAME" .lane/release-assets/* --clobber
          else
            # A rerun may finish promotion, but can never change public versioned bytes.
            gh release download "$GITHUB_REF_NAME" --pattern latest.json --dir .lane/existing-release
            diff <(jq -S 'del(.pub_date)' .lane/release-assets/latest.json) <(jq -S 'del(.pub_date)' .lane/existing-release/latest.json)
            cp .lane/existing-release/latest.json .lane/release-assets/latest.json
          fi
          gh release download "$GITHUB_REF_NAME" --dir .lane/published-release
          for asset in .lane/release-assets/*; do
            cmp "$asset" ".lane/published-release/$(basename "$asset")"
          done
          (cd .lane/published-release && sha256sum --check ./*.sha256)
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --latest=false --notes-file "$RUNNER_TEMP/app-release-notes.md"
      - name: Promote only a newer complete app manifest
        shell: bash
        run: |
          set -euo pipefail
          # Service runtime releases share the repository, never the app channel.
          releases=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.tag_name == "app-latest") | .id')
          if [[ -n $releases ]]; then
            gh release download app-latest --pattern latest.json --dir .lane/current-release
            current=$(jq --exit-status --raw-output '.version | select(test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))' .lane/current-release/latest.json)
            if [[ $current == "$APP_VERSION" ]]; then
              cmp .lane/release-assets/latest.json .lane/current-release/latest.json
              exit 0
            fi
            if ! printf '%s\n' "$current" "$APP_VERSION" | sort --version-sort --check=quiet; then
              echo "Leaving app-latest at $current; release $APP_VERSION remains available by its versioned tag."
              exit 0
            fi
            gh release upload app-latest .lane/release-assets/latest.json --clobber
          else
            gh release create app-latest .lane/release-assets/latest.json \
              --target "$GITHUB_SHA" --prerelease --latest=false --title 'Omarchy Bot updater channel' \
              --notes 'Complete Linux, macOS and Windows app updater manifest; artifact URLs point to immutable app-vX.Y.Z releases. Separate from Service runtime releases.'
          fi
          gh release download app-latest --pattern latest.json --dir .lane/promoted-release
          cmp .lane/release-assets/latest.json .lane/promoted-release/latest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-release-${{ github.ref_name }}-publication-evidence
          path: |
            .lane/release-assets/latest.json
            .lane/published-release/*.sha256
            .lane/promoted-release/latest.json
          if-no-files-found: warn
