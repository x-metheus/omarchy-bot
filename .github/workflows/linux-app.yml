name: linux-app
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-app-${{ github.ref }}
  cancel-in-progress: false
jobs:
  webkit-appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build packaged Linux app in pinned container
        run: bash tools/release/build-linux-app.sh
      - name: Smoke packaged AppImage in private WebKitGTK session
        run: bash tools/release/smoke-linux-app.sh .lane/dist/omarchy-bot_0.1.0_amd64.AppImage
      - name: Prove signed updates and tamper refusal in packaged WebKitGTK
        run: bash tools/release/linux-app/updater-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-app-webkit-evidence
          path: |
            .lane/dist/*.AppImage
            .lane/dist/*.AppImage.sha256
            .lane/dist/omarchy-agent-daemon_*
            .lane/dist/*.AppImage.sig
            .lane/linux-app/evidence/
          if-no-files-found: error
