name: checks
on:
  pull_request:
    paths:
      - 'apps/agent-daemon/**'
      - 'apps/metheus/**'
      - 'apps/site/**'
      - 'crates/logging/**'
      - 'tools/release/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'mise.toml'
      - '.github/workflows/checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: bun --cwd=apps/metheus install --frozen-lockfile
      - run: bun --cwd=apps/metheus run typecheck
      - run: bun test
        working-directory: apps/metheus
      - run: cargo test --locked -p metheus -p metheus-logging
  agent-daemon:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - run: cargo test --locked -p metheus-agent-daemon --test conversation
  tooling:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        directory: [apps/site, tools/release]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
